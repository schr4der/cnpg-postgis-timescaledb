name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PG_MAJOR: "17"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: |
        docker build \
          --tag "$IMAGE:$PG_MAJOR" \
          --tag "$IMAGE:$PG_MAJOR-${{ github.sha }}" \
          .

    - name: Push
      run: |
        docker push "$IMAGE:$PG_MAJOR-${{ github.sha }}"
        docker push "$IMAGE:$PG_MAJOR"

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        docker tag "$IMAGE:$PG_MAJOR" "$IMAGE:${{ github.ref_name }}"
        docker push "$IMAGE:${{ github.ref_name }}"
        gh release create "${{ github.ref_name }}" --generate-notes \
          --notes "Image: \`$IMAGE:${{ github.ref_name }}\`"
