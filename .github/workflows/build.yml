name: Build and Push to DigitalOcean Container Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: do-registry-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com
  PG_MAJOR: "17"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        version: 1.154.0
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Log in to DigitalOcean Container Registry
      run: doctl registry login --expiry-seconds 3600

    - name: Build image
      run: |
        docker build \
          --tag ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAME }}/cnpg-timescaledb:${{ env.PG_MAJOR }} \
          --tag ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAME }}/cnpg-timescaledb:${{ env.PG_MAJOR }}-${{ github.sha }} \
          .

    - name: Push image
      run: |
        docker push ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAME }}/cnpg-timescaledb:${{ env.PG_MAJOR }}-${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAME }}/cnpg-timescaledb:${{ env.PG_MAJOR }}

    - name: Clean up old SHA tags
      run: |
        tags=$(doctl registry repository list-tags cnpg-timescaledb --format Tag,UpdatedAt --no-header | \
               grep -v "^${{ env.PG_MAJOR }} " | \
               tail -n +4 | \
               awk '{print $1}' || true)
        if [ -n "$tags" ]; then
          echo "$tags" | xargs -I {} doctl registry repository delete-tag cnpg-timescaledb {} --force
        fi
